<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Job Hunter — Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #111827; padding: 24px; }
  .container { max-width: 1200px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: #fff; padding: 14px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stat .v { font-size: 26px; font-weight: 800; }
  .stat .l { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input, select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .primary { background: #111827; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .card .title { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .card .company { color: #2563eb; font-weight: 600; font-size: 13px; margin-top: 2px; }
  .card .meta { font-size: 12px; color: #6b7280; display: flex; gap: 10px; flex-wrap: wrap; }
  .score { font-weight: 800; font-size: 17px; text-align: right; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  .high { background: #dcfce7; color: #166534; }
  .med { background: #fef9c3; color: #713f12; }
  .low { background: #fee2e2; color: #991b1b; }
  .desc { font-size: 12.5px; color: #374151; max-height: 110px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .skills { display: flex; gap: 5px; flex-wrap: wrap; }
  .skill { font-size: 11px; background: #e5e7eb; padding: 2px 7px; border-radius: 4px; }
  .skill.missing { background: #fee2e2; color: #991b1b; }
  .reasoning { font-size: 12.5px; color: #4b5563; }
  .links a { color: #2563eb; text-decoration: none; font-size: 13px; margin-right: 14px; }
  .actions { display: flex; gap: 6px; border-top: 1px solid #f3f4f6; padding-top: 10px; margin-top: auto; }
  .approve { background: #16a34a; color: #fff; }
  .reject { background: #dc2626; color: #fff; }
  .applied { background: #2563eb; color: #fff; }
  .quiet { background: #f3f4f6; color: #374151; }
  .status-tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
  .status-pending { background: #f3f4f6; color: #6b7280; }
  .status-approved { background: #dcfce7; color: #166534; }
  .status-rejected { background: #fee2e2; color: #991b1b; }
  .status-applied { background: #dbeafe; color: #1e40af; }
  .empty { text-align: center; padding: 60px 20px; color: #6b7280; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>AI Job Hunter — LinkedIn Review</h1>
      <div style="font-size: 13px; color: #6b7280;">Posts captured by the browser extension. Set status to Applied when you submit an application.</div>
    </div>
    <button class="primary" onclick="load()">Refresh</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="v" id="sTotal">0</div><div class="l">Total</div></div>
    <div class="stat"><div class="v" id="sHigh">0</div><div class="l">High (85+)</div></div>
    <div class="stat"><div class="v" id="sMed">0</div><div class="l">Medium (70–84)</div></div>
    <div class="stat"><div class="v" id="sApplied">0</div><div class="l">Applied</div></div>
    <div class="stat"><div class="v" id="sApproved">0</div><div class="l">Approved</div></div>
  </div>

  <div class="controls">
    <input id="q" placeholder="Filter by title, company, skill..." oninput="render()" style="flex:1; min-width: 220px;">
    <select id="pri" onchange="render()">
      <option value="all">All priorities</option>
      <option value="high">High only</option>
      <option value="med">Medium only</option>
      <option value="low">Low only</option>
    </select>
    <select id="st" onchange="render()">
      <option value="all">All statuses</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="applied">Applied</option>
      <option value="rejected">Rejected</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
let JOBS = [];

async function load() {
  try {
    console.log("Fetching jobs from API...");
    const r = await fetch("/api/jobs");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    console.log("API Response:", data);
    JOBS = data.jobs || [];
  } catch (e) {
    console.error("Failed to load jobs:", e);
    JOBS = [];
  }
  render();
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

function prioBadge(score) {
  if (score >= 85) return '<span class="badge high">High</span>';
  if (score >= 70) return '<span class="badge med">Medium</span>';
  return '<span class="badge low">Low</span>';
}

function statusTag(s) {
  return '<span class="status-tag status-' + s + '">' + s.toUpperCase() + '</span>';
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const pri = document.getElementById("pri").value;
  const st = document.getElementById("st").value;

  const list = JOBS.filter(function(j) {
    const hay = (j.title + " " + j.company + " " + (j.matchedSkills || []).join(" ") + " " + (j.missingSkills || []).join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return false;
    const sc = j.matchScore || 0;
    if (pri === "high" && sc < 85) return false;
    if (pri === "med" && (sc < 70 || sc >= 85)) return false;
    if (pri === "low" && sc >= 70) return false;
    if (st !== "all" && (j.status || "pending") !== st) return false;
    return true;
  });

  document.getElementById("sTotal").textContent = JOBS.length;
  document.getElementById("sHigh").textContent = JOBS.filter(function(j) { return (j.matchScore || 0) >= 85; }).length;
  document.getElementById("sMed").textContent = JOBS.filter(function(j) { return (j.matchScore || 0) >= 70 && (j.matchScore || 0) < 85; }).length;
  document.getElementById("sApplied").textContent = JOBS.filter(function(j) { return j.status === "applied"; }).length;
  document.getElementById("sApproved").textContent = JOBS.filter(function(j) { return j.status === "approved"; }).length;

  const grid = document.getElementById("grid");
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No jobs yet.<br>Start the server, load the extension, and scroll LinkedIn.<br><br>Server: <code>npx tsx src/server.ts</code></div>';
    return;
  }

  grid.innerHTML = list.map(function(j) {
    var id = j.jobId || j.externalId;
    var status = j.status || "pending";
    return '<div class="card">' +
      '<div class="head">' +
        '<div>' +
          '<div class="title">' + esc(j.title) + '</div>' +
          '<div class="company">' + esc(j.company) + '</div>' +
        '</div>' +
        '<div>' +
          '<div class="score">' + (j.matchScore ?? "—") + '/100</div>' +
          prioBadge(j.matchScore || 0) +
        '</div>' +
      '</div>' +
      '<div class="meta">' +
        '<span>' + esc(j.location || "—") + '</span>' +
        '<span>' + esc(j.experienceLevel || "—") + '</span>' +
        '<span>' + esc(j.eligibility || "—") + '</span>' +
        statusTag(status) +
      '</div>' +
      '<div class="desc">' + esc(j.description || "") + '</div>' +
      '<div class="skills">' + (j.matchedSkills || []).map(function(s) { return '<span class="skill">' + esc(s) + '</span>'; }).join("") + '</div>' +
      ((j.missingSkills || []).length ? '<div class="skills">' + (j.missingSkills || []).map(function(s) { return '<span class="skill missing">' + esc(s) + '</span>'; }).join("") + '</div>' : "") +
      (j.explanation ? '<div class="reasoning"><strong>Why:</strong> ' + esc(j.explanation) + '</div>' : "") +
      '<div class="links"><a href="' + esc(j.originalUrl) + '" target="_blank" rel="noopener">Open on LinkedIn</a></div>' +
      '<div class="actions">' +
        '<button class="' + (status === "approved" ? "approve" : "quiet") + '" onclick="setStatus(\'' + esc(id) + '\', \'approved\')">Approve</button>' +
        '<button class="' + (status === "applied" ? "applied" : "quiet") + '" onclick="setStatus(\'' + esc(id) + '\', \'applied\')">Applied</button>' +
        '<button class="' + (status === "rejected" ? "reject" : "quiet") + '" onclick="setStatus(\'' + esc(id) + '\', \'rejected\')">Reject</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

async function setStatus(id, status) {
  try {
    await fetch('/api/jobs/' + encodeURIComponent(id) + '/status', {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: status })
    });
    await load();
  } catch (e) {
    console.error("Failed to update status:", e);
  }
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
