<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; width: 340px; padding: 14px; color: #111827; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 13px; }
  .toggle { display: flex; gap: 8px; align-items: center; margin: 10px 0; padding: 10px; background: #f3f4f6; border-radius: 8px; }
  .warn { font-size: 11px; color: #92400e; background: #fef3c7; padding: 8px; border-radius: 6px; margin: 8px 0; line-height: 1.4; }
  button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 8px; }
  .open { background: #111827; color: #fff; }
  .status { font-size: 12px; color: #6b7280; margin-top: 8px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; }
  .on { background: #dcfce7; color: #166534; }
  .off { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
  <h1>AI Job Hunter</h1>
  <div class="row"><span>Jobs saved</span><span id="sent">0</span></div>
  <div class="row"><span>Server</span><span id="health">checking…</span></div>

  <div class="toggle">
    <div>
      <div style="font-weight:600;">Auto-scroll</div>
      <div style="font-size:11px;color:#6b7280;">1 sec per post</div>
    </div>
    <span class="badge off" id="badgeScroll">off</span>
  </div>
  <button id="btnScroll">Enable Auto-scroll</button>

  <div class="toggle">
    <div>
      <div style="font-weight:600;">Auto-like</div>
      <div style="font-size:11px;color:#6b7280;">10 sec wait, then like matching posts</div>
    </div>
    <span class="badge off" id="badgeLike">off</span>
  </div>
  <button id="btnLike">Enable Auto-like</button>

  <div class="warn">
    Auto-scroll and auto-like are detectable by LinkedIn. Use sparingly. Manual scrolling is safest.
  </div>

  <button class="open" id="open">Open Dashboard</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
